
<!-- Shopping Bag with Cart Quantity Badge -->
<a href="{% url 'cart:cart' %}"
   class="nav-icon nav-cart-link"
   title="Shopping Bag"
   aria-label="Shopping Bag">

    <i class="bi bi-bag"></i>

    {% if cart_count > 0 %}
    <span class="cart-count-badge">{{ cart_count }}</span>
    {% endif %}

</a>
