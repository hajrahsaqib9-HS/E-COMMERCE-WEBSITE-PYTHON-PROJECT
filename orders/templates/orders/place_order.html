
{% extends 'orders/base_orders.html' %}

{% block content %}
<div class="form-card">
    <h2>Place Your Order</h2>
    <p>Enter your details to complete your order.</p>

    <form method="POST">
        {% csrf_token %}

        <h5>Customer Details</h5>
        <input class="form-control" name="customer_name" placeholder="Full Name" required>
        <input class="form-control" type="email" name="email" placeholder="Email Address" required>
        <input class="form-control" name="phone" placeholder="Phone Number" required>
        <textarea class="form-control" name="address" placeholder="Delivery Address" required></textarea>
        <input class="form-control" name="city" placeholder="City" required>

        <h5>Product Details</h5>
        <input class="form-control" name="product_name" placeholder="Product Name" required>
        <input class="form-control" type="number" name="quantity" min="1" value="1" required>
        <input class="form-control" type="number" name="price" min="0.01" step="0.01" placeholder="Product Price" required>

        <h5>Payment Method</h5>
        <select class="form-select" name="payment_method" required>
            <option value="">Select Payment Method</option>
            <option value="Cash on Delivery">Cash on Delivery</option>
            <option value="Bank Transfer">Bank Transfer</option>
        </select>

        <button class="btn order-btn w-100" type="submit">Place Order</button>
    </form>
</div>
{% endblock %}
